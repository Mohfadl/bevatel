<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile | Bevatel</title>


    <link
        rel="stylesheet"
        href="/admin/assets/shared.css"
    >

    <link
        rel="stylesheet"
        href="/admin/assets/profile.css"
    >

</head>


<body>

    <bevatel-sidebar
        active="profile"
    ></bevatel-sidebar>


    <main class="app-page profile-page">

        <bevatel-page-header
            title="My Profile"
            show-menu="false"
        ></bevatel-page-header>


        <div class="profile-content">


            <!--
            ================================================================
            Loading
            ================================================================
            -->

            <div
                id="profile-loading"
                class="profile-loading"
            >
                Loading your profile...
            </div>


            <!--
            ================================================================
            Error
            ================================================================
            -->

            <div
                id="profile-error"
                class="profile-alert profile-alert-error hidden"
            ></div>


            <!--
            ================================================================
            Profile Content
            ================================================================
            -->

            <div
                id="profile-container"
                class="profile-grid hidden"
            >


                <!--
                ============================================================
                Personal Information
                ============================================================
                -->

                <section class="profile-card">

                    <div class="profile-card-header">

                        <div>

                            <h2>
                                Personal Information
                            </h2>

                            <p>
                                Update your account name and email address.
                            </p>

                        </div>

                    </div>


                    <form
                        id="profile-form"
                        class="profile-form"
                    >

                        <div class="profile-field">

                            <label for="profile-name">
                                Name
                            </label>

                            <input
                                id="profile-name"
                                name="name"
                                type="text"
                                maxlength="150"
                                autocomplete="name"
                                required
                            >

                            <div
                                id="name-error"
                                class="profile-field-error"
                            ></div>

                        </div>


                        <div class="profile-field">

                            <label for="profile-email">
                                Email
                            </label>

                            <input
                                id="profile-email"
                                name="email"
                                type="email"
                                maxlength="255"
                                autocomplete="email"
                                required
                            >

                            <div
                                id="email-error"
                                class="profile-field-error"
                            ></div>

                        </div>


                        <div class="profile-two-columns">

                            <div class="profile-field">

                                <label for="profile-role">
                                    Role
                                </label>

                                <input
                                    id="profile-role"
                                    type="text"
                                    readonly
                                >

                            </div>


                            <div class="profile-field">

                                <label for="profile-status">
                                    Status
                                </label>

                                <input
                                    id="profile-status"
                                    type="text"
                                    readonly
                                >

                            </div>

                        </div>


                        <div class="profile-form-footer">

                            <button
                                id="save-profile-button"
                                type="submit"
                                class="profile-primary-button"
                            >
                                Save Changes
                            </button>

                        </div>

                    </form>

                </section>


                <!--
                ============================================================
                Change Password
                ============================================================
                -->

                <section class="profile-card">

                    <div class="profile-card-header">

                        <div>

                            <h2>
                                Change Password
                            </h2>

                            <p>
                                Use your current password to set a new one.
                            </p>

                        </div>

                    </div>


                    <form
                        id="password-form"
                        class="profile-form"
                    >

                        <div class="profile-field">

                            <label for="current-password">
                                Current Password
                            </label>

                            <input
                                id="current-password"
                                name="currentPassword"
                                type="password"
                                autocomplete="current-password"
                                required
                            >

                        </div>


                        <div class="profile-field">

                            <label for="new-password">
                                New Password
                            </label>

                            <input
                                id="new-password"
                                name="newPassword"
                                type="password"
                                minlength="8"
                                autocomplete="new-password"
                                required
                            >

                            <small class="profile-field-help">
                                Minimum 8 characters.
                            </small>

                        </div>


                        <div class="profile-field">

                            <label for="new-password-confirmation">
                                Confirm New Password
                            </label>

                            <input
                                id="new-password-confirmation"
                                name="newPasswordConfirmation"
                                type="password"
                                minlength="8"
                                autocomplete="new-password"
                                required
                            >

                        </div>


                        <div
                            id="password-error"
                            class="profile-alert profile-alert-error hidden"
                        ></div>


                        <div class="profile-form-footer">

                            <button
                                id="update-password-button"
                                type="submit"
                                class="profile-primary-button"
                            >
                                Update Password
                            </button>

                        </div>

                    </form>

                </section>


                <!--
                ============================================================
                Account Information
                ============================================================
                -->

                <section class="profile-card profile-account-card">

                    <div class="profile-card-header">

                        <div>

                            <h2>
                                Account Information
                            </h2>

                            <p>
                                Basic information about your account.
                            </p>

                        </div>

                    </div>


                    <div class="profile-account-information">

                        <div class="profile-information-row">

                            <span>
                                User ID
                            </span>

                            <strong id="profile-user-id">
                                -
                            </strong>

                        </div>


                        <div class="profile-information-row">

                            <span>
                                Organization ID
                            </span>

                            <strong id="profile-organization-id">
                                -
                            </strong>

                        </div>


                        <div class="profile-information-row">

                            <span>
                                Member Since
                            </span>

                            <strong id="profile-created-at">
                                -
                            </strong>

                        </div>

                    </div>

                </section>


            </div>


        </div>

    </main>


    <!-- Toast -->

    <div
        id="profile-toast"
        class="profile-toast hidden"
        role="status"
        aria-live="polite"
    ></div>


    <script
        type="module"
        src="/admin/components/app-sidebar.js"
    ></script>

    <script
        type="module"
        src="/admin/components/page-header.js"
    ></script>

    <script
        type="module"
        src="/admin/assets/profile.js"
    ></script>

</body>

</html>
