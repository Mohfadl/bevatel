<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Bevatel</title>
  <link rel="stylesheet" href="/admin/assets/dashboard.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-circle">B</div>
    </div>
    <nav class="sidebar-navigation">
      <a href="/admin/dashboard.html" class="sidebar-item active" title="Dashboard">
        <svg viewBox="0 0 24 24">
          <path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z"/>
        </svg>
        <span class="tooltip">Dashboard</span>
      </a>

      <a href="/admin/" class="sidebar-item" title="Conversations">
        <svg viewBox="0 0 24 24">
          <path d="M4 4h16v12H7l-3 3V4Zm3 5h10V7H7v2Zm0 4h7v-2H7v2Z"/>
        </svg>
        <span class="tooltip">Conversations</span>
      </a>

      <a href="#" class="sidebar-item" title="Contacts">
        <svg viewBox="0 0 24 24">
          <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8c0-4 3-6 7-6s7 2 7 6H5Z"/>
        </svg>
        <span class="tooltip">Contacts</span>
      </a>

      <a href="#" class="sidebar-item" title="Campaigns">
        <svg viewBox="0 0 24 24">
          <path d="m3 11 15-6v14L3 13v-2Zm2 4 3 1v4H5v-5Z"/>
        </svg>
        <span class="tooltip">Campaigns</span>
      </a>

      <a href="#" class="sidebar-item" title="Teams">
        <svg viewBox="0 0 24 24">
          <path
            d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2 19c0-4 3-6 6-6s6 2 6 6H2Zm10 0c0-2-.7-3.8-2-5 1.6-1 3.2-1 4-1 3 0 6 2 6 6h-8Z"
          />
        </svg>
        <span class="tooltip">Teams</span>
      </a>

      <a href="#" class="sidebar-item" title="Reports">
        <svg viewBox="0 0 24 24">
          <path d="M4 19h16v2H2V3h2v16Zm3-2v-6h3v6H7Zm5 0V7h3v10h-3Zm5 0V4h3v13h-3Z"/>
        </svg>
        <span class="tooltip">Reports</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <button class="sidebar-item sidebar-button" title="Settings">
        <svg viewBox="0 0 24 24">
          <path
            d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.4 1A8 8 0 0 0 15.3 6L15 3.5h-4L10.7 6A8 8 0 0 0 9 7.1l-2.4-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 1.7 1.1l.3 2.5h4l.3-2.5a8 8 0 0 0 1.7-1.1l2.4 1 2-3.4-2-1.5ZM13 15a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"
          />
        </svg>
        <span class="tooltip">Settings</span>
      </button>
      <div class="sidebar-user" id="sidebarUser">U</div>
    </div>
  </aside>

  <div class="page">
    <header class="topbar">
      <div class="topbar-title">
        <div class="dashboard-mark">
          <svg viewBox="0 0 24 24">
            <path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z"/>
          </svg>
        </div>
        <h1>Dashboard</h1>
      </div>

      <div class="topbar-actions">
        <button id="refreshDashboard" class="refresh-button" type="button" >
          <svg viewBox="0 0 24 24"> <path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.7-4.2L13 11h8V3l-3.3 3.3Z"/> </svg>
          Refresh
        </button>
      </div>
    </header>

    <main class="dashboard-content">
      <section class="dashboard-main">
        <h2 class="section-title">Conversations Status</h2>
        <div class="stats-grid">
          <article class="stat-card">
            <div class="stat-icon stat-icon-open">
              <svg viewBox="0 0 24 24">
                <path d="M4 4h16v13H7l-3 3V4Zm2 2v9.2L6.2 15H18V6H6Z"/>
              </svg>
            </div>

            <div class="stat-content">
              <span class="stat-label"> Open </span>
              <strong id="openCount" class="stat-number"> 0</strong>
            </div>
          </article>

          <article class="stat-card">
            <div class="stat-icon stat-icon-resolved">
              <svg viewBox="0 0 24 24">
                <path d="m9.5 16.2-4-4L7 10.8l2.5 2.5L17 5.8l1.5 1.4-9 9ZM12 22a10 10 0 1 1 8.7-5l-1.8-1A8 8 0 1 0 12 20a8 8 0 0 0 7.7-5.8l1.9.5A10 10 0 0 1 12 22Z"/>
              </svg>
            </div>

            <div class="stat-content">
              <span class="stat-label">Resolved</span>
              <strong id="resolvedCount" class="stat-number" >0</strong>
            </div>
          </article>

          <article class="stat-card">
            <div class="stat-icon stat-icon-snoozed">
              <svg viewBox="0 0 24 24">
                <path d="M7 3h10v2H7V3Zm1 4h8v2h-3l3 4v4h-3v4h-2v-4H8v-4l3-4H8V7Zm2 7v1h4v-1l-2-2.7L10 14Z"/>
              </svg>
            </div>

            <div class="stat-content">
              <span class="stat-label">Snoozed</span>
              <strong id="snoozedCount" class="stat-number">0</strong>
            </div>
          </article>
        </div>

        <div class="separator"></div>

        <section class="agents-table-card">
          <div class="table-wrapper">
            <table>
              <thead>
              <tr>
                <th>Agent</th>
                <th class="number-column">Open</th>
                <th class="number-column">Resolved</th>
                <th class="number-column">Snoozed</th>
              </tr>
              </thead>
              <tbody id="agentsTableBody">
              <tr>
                <td colspan="4" class="loading-cell" >
                  Loading dashboard...
                </td>
              </tr>
              </tbody>
            </table>
          </div>

          <div class="table-footer">
            <div class="pagination">
              <button id="previousPage" class="pagination-button" type="button">‹</button>
              <button id="nextPage" class="pagination-button" type="button">›</button>
              <span>Go to</span>
              <input id="pageInput" class="page-input" type="number" value="1" min="1" >
              <span id="totalPagesLabel">- 1</span>
            </div>

            <div id="tableResults" class="results-label" >
              Results: 0 Of 0
            </div>
          </div>
        </section>
      </section>

      <aside class="agent-status-column">
        <h2 class="section-title">Agent status</h2>
        <section class="agent-status-card">
          <div class="presence-summary">
            <div class="presence-stat">
              <div class="presence-icon online-icon">◷</div>
              <strong id="onlineCount">0</strong>
              <span>Online</span>
            </div>

            <div class="presence-stat">
              <div class="presence-icon busy-icon">◷</div>
              <strong id="busyCount">0</strong>
              <span>Busy</span>
            </div>

            <div class="presence-stat">
              <div class="presence-icon offline-icon">◷</div>
              <strong id="offlineCount">0</strong>
              <span>Offline</span>
            </div>
          </div>

          <div class="agents-list-heading">Agents List</div>
          <div class="agent-filters">
            <select id="teamFilter" aria-label="Team">
              <option value="">Teams</option>
            </select>
            <select id="statusFilter" aria-label="Status">
              <option value="">Status</option>
              <option value="ONLINE">Online</option>
              <option value="BUSY">Busy</option>
              <option value="OFFLINE">Offline</option>
            </select>
          </div>

          <div id="agentsResultCount" class="agents-result-count" >Showing 0 results</div>
          <div id="agentsPresenceList" class="agents-presence-list" >
          </div>
        </section>
      </aside>
    </main>
  </div>
</div>

<div id="dashboardToast" class="toast" ></div>

<script src="/socket.io/socket.io.js" ></script>
<script src="/admin/assets/dashboard.js"></script>

</body>
</html>
